<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1020" viewBox="0 0 760 1020" role="img" aria-labelledby="title desc">
<title id="title">PulseShift: Complete System Hardware Wiring</title>
<desc id="desc">End-to-end wiring: Motorcycle power &amp; diagnostic connector, DC-DC converter, ESP32, CAN transceiver, LEDs, and optional OLED.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
</style>
<rect width="760" height="1020" fill="#ffffff"/>
<text x="28" y="44" font-size="24" fill="#142b3b" font-weight="700" text-anchor="start">PulseShift: Complete System Hardware Wiring</text>
<text x="28" y="80" font-size="20" fill="#425c6d" font-weight="400" text-anchor="start">Full system integration: motorcycle power, passive CAN tap, ESP32, and shift light</text>
<rect x="20" y="105" width="345" height="235" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="35" y="130" font-size="15" fill="#991b1b" font-weight="700" text-anchor="start">POWER SUBSYSTEM (Motorcycle)</text>
<rect x="35" y="145" width="130" height="65" rx="6" fill="#fef2f2" stroke="#991b1b" stroke-width="2"/>
<text x="100" y="172" font-size="13" fill="#991b1b" font-weight="700" text-anchor="middle">12V Switched</text>
<text x="100" y="192" font-size="12" fill="#425c6d" font-weight="400" text-anchor="middle">Ignition Feed</text>
<path d="M 165,177 L 195,177" fill="none" stroke="#991b1b" stroke-width="3"/>
<rect x="195" y="167" width="35" height="20" rx="4" fill="#fef3c7" stroke="#991b1b" stroke-width="2"/>
<text x="212" y="181" font-size="11" fill="#991b1b" font-weight="700" text-anchor="middle">1A</text>
<text x="212" y="202" font-size="11" fill="#425c6d" font-weight="400" text-anchor="middle">Fuse</text>
<rect x="250" y="145" width="100" height="75" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="300" y="170" font-size="13" fill="#142b3b" font-weight="700" text-anchor="middle">DC-DC Buck</text>
<text x="300" y="188" font-size="12" fill="#ba2e34" font-weight="700" text-anchor="middle">12V -&gt; 5V</text>
<text x="300" y="205" font-size="11" fill="#425c6d" font-weight="400" text-anchor="middle">≥ 2A Rating</text>
<path d="M 230,177 L 250,177" fill="none" stroke="#991b1b" stroke-width="3"/>
<path d="M 100,210 L 100,235 L 300,235 L 300,220" fill="none" stroke="#334155" stroke-width="3"/>
<circle cx="200" cy="235" r="5" fill="#334155"/>
<path d="M 200,235 L 200,247" fill="none" stroke="#334155" stroke-width="3"/>
<path d="M 184,247 L 216,247" fill="none" stroke="#334155" stroke-width="3"/>
<path d="M 190,254 L 210,254" fill="none" stroke="#334155" stroke-width="3"/>
<path d="M 196,261 L 204,261" fill="none" stroke="#334155" stroke-width="3"/>
<text x="100" y="260" font-size="11" fill="#334155" font-weight="400" text-anchor="start">Chassis / Battery GND</text>
<rect x="30" y="275" width="325" height="55" rx="6" fill="#fef2f2" stroke="#ba2e34" stroke-width="2"/>
<text x="40" y="295" font-size="13" fill="#ba2e34" font-weight="700" text-anchor="start">DANGER: NEVER connect raw +12V</text>
<text x="40" y="313" font-size="11" fill="#ba2e34" font-weight="400" text-anchor="start">directly to ESP32 (VIN, 5V, 3V3) or CAN transceiver!</text>
<rect x="20" y="350" width="345" height="330" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="35" y="375" font-size="15" fill="#7c3aed" font-weight="700" text-anchor="start">CAN INTERFACE (Passive Tap)</text>
<rect x="35" y="390" width="140" height="95" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="105" y="412" font-size="13" fill="#142b3b" font-weight="700" text-anchor="middle">Diagnostic Port</text>
<text x="105" y="430" font-size="11" fill="#425c6d" font-weight="400" text-anchor="middle">Euro 5 / OBD-II</text>
<text x="45" y="452" font-size="11" fill="#16a34a" font-weight="700" text-anchor="start">CAN-H</text>
<text x="45" y="472" font-size="11" fill="#ca8a04" font-weight="700" text-anchor="start">CAN-L</text>
<text x="115" y="472" font-size="11" fill="#334155" font-weight="700" text-anchor="start">GND</text>
<rect x="205" y="390" width="145" height="160" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="277" y="412" font-size="13" fill="#f8fafc" font-weight="700" text-anchor="middle">SN65HVD230</text>
<text x="277" y="428" font-size="10" fill="#94a3b8" font-weight="400" text-anchor="middle">3.3V Transceiver</text>
<text x="215" y="452" font-size="10" fill="#f8fafc" font-weight="400" text-anchor="start">CANH / CANL</text>
<text x="215" y="472" font-size="10" fill="#38bdf8" font-weight="400" text-anchor="start">Rs -&gt; GND</text>
<text x="215" y="492" font-size="10" fill="#ba2e34" font-weight="400" text-anchor="start">TXD -&gt; 3.3V</text>
<text x="215" y="512" font-size="10" fill="#7c3aed" font-weight="700" text-anchor="start">RXD -&gt; GPIO16</text>
<text x="215" y="532" font-size="10" fill="#ea580c" font-weight="400" text-anchor="start">VCC 3.3V / GND</text>
<path d="M 175,448 L 205,448" fill="none" stroke="#16a34a" stroke-width="2.5"/>
<path d="M 175,468 L 205,468" fill="none" stroke="#ca8a04" stroke-width="2.5"/>
<rect x="35" y="560" width="315" height="108" rx="6" fill="#fef2f2" stroke="#ba2e34" stroke-width="2"/>
<text x="45" y="582" font-size="12" fill="#ba2e34" font-weight="700" text-anchor="start">PASSIVE SAFETY REQUIREMENTS:</text>
<text x="45" y="600" font-size="11" fill="#142b3b" font-weight="700" text-anchor="start">1. GPIO17 Physically Disconnected (Air Gap)</text>
<text x="45" y="618" font-size="11" fill="#142b3b" font-weight="400" text-anchor="start">2. Transceiver TXD pulled up to 3.3V (Recessive)</text>
<text x="45" y="636" font-size="11" fill="#ea580c" font-weight="700" text-anchor="start">3. Onboard 120Ω resistor REMOVED from module</text>
<text x="45" y="654" font-size="11" fill="#142b3b" font-weight="400" text-anchor="start">4. Transceiver VCC powered from ESP32 3V3 rail</text>
<rect x="385" y="105" width="355" height="395" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
<text x="562" y="138" font-size="17" fill="#f8fafc" font-weight="700" text-anchor="middle">ESP32 DevKit V1 (Core Controller)</text>
<text x="562" y="160" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle">TWAI Listen-Only • Shift Light Logic • Diag Logging</text>
<rect x="400" y="185" width="65" height="25" rx="4" fill="#fca5a5" stroke="#ba2e34" stroke-width="2"/>
<text x="432" y="202" font-size="12" fill="#ba2e34" font-weight="700" text-anchor="middle">VIN (5V)</text>
<rect x="400" y="220" width="65" height="25" rx="4" fill="#94a3b8" stroke="#334155" stroke-width="2"/>
<text x="432" y="237" font-size="12" fill="#334155" font-weight="700" text-anchor="middle">GND</text>
<rect x="400" y="260" width="65" height="25" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
<text x="432" y="277" font-size="12" fill="#ea580c" font-weight="700" text-anchor="middle">3V3 OUT</text>
<rect x="400" y="310" width="85" height="25" rx="4" fill="#d8b4fe" stroke="#7c3aed" stroke-width="2"/>
<text x="442" y="327" font-size="12" fill="#7c3aed" font-weight="700" text-anchor="middle">GPIO16 (RX)</text>
<rect x="400" y="350" width="85" height="25" rx="4" fill="#fecaca" stroke="#ba2e34" stroke-width="2"/>
<text x="442" y="367" font-size="12" fill="#ba2e34" font-weight="700" text-anchor="middle">GPIO17 (TX)</text>
<path d="M 485,362 L 520,362" fill="none" stroke="#ba2e34" stroke-width="2.5" stroke-dasharray="4,3"/>
<circle cx="526" cy="362" r="4" fill="#ffffff" stroke="#ba2e34" stroke-width="2"/>
<text x="538" y="367" font-size="11" fill="#ba2e34" font-weight="700" text-anchor="start">DISCONNECTED</text>
<rect x="400" y="400" width="85" height="25" rx="4" fill="#93c5fd" stroke="#0969aa" stroke-width="2"/>
<text x="442" y="417" font-size="12" fill="#0969aa" font-weight="700" text-anchor="middle">GPIO27</text>
<rect x="400" y="445" width="85" height="22" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
<text x="442" y="461" font-size="11" fill="#854d0e" font-weight="700" text-anchor="middle">GPIO21/22</text>
<text x="495" y="461" font-size="11" fill="#94a3b8" font-weight="400" text-anchor="start">Optional I2C (OLED)</text>
<rect x="630" y="445" width="90" height="30" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
<text x="675" y="465" font-size="11" fill="#142b3b" font-weight="700" text-anchor="middle">Micro-USB</text>
<path d="M 350,182 L 375,182 L 375,197 L 400,197" fill="none" stroke="#ba2e34" stroke-width="3"/>
<circle cx="375" cy="182" r="5" fill="#ba2e34"/>
<path d="M 400,272 L 360,272 L 360,532 L 350,532" fill="none" stroke="#ea580c" stroke-width="2.5"/>
<path d="M 350,512 L 370,512 L 370,322 L 400,322" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
<rect x="385" y="515" width="355" height="190" rx="10" fill="#244238" stroke="#1b332b" stroke-width="2"/>
<text x="400" y="540" font-size="15" fill="#a7f3d0" font-weight="700" text-anchor="start">WS2812B 6-LED Shift Light (5V • GRB)</text>
<rect x="405" y="555" width="42" height="42" rx="6" fill="#16a34a" stroke="#9eb7aa" stroke-width="2"/>
<text x="426" y="580" font-size="12" fill="#142b3b" font-weight="700" text-anchor="middle">L1</text>
<rect x="458" y="555" width="42" height="42" rx="6" fill="#16a34a" stroke="#9eb7aa" stroke-width="2"/>
<text x="479" y="580" font-size="12" fill="#142b3b" font-weight="700" text-anchor="middle">L2</text>
<rect x="511" y="555" width="42" height="42" rx="6" fill="#ca8a04" stroke="#9eb7aa" stroke-width="2"/>
<text x="532" y="580" font-size="12" fill="#142b3b" font-weight="700" text-anchor="middle">L3</text>
<rect x="564" y="555" width="42" height="42" rx="6" fill="#ca8a04" stroke="#9eb7aa" stroke-width="2"/>
<text x="585" y="580" font-size="12" fill="#142b3b" font-weight="700" text-anchor="middle">L4</text>
<rect x="617" y="555" width="42" height="42" rx="6" fill="#ea580c" stroke="#9eb7aa" stroke-width="2"/>
<text x="638" y="580" font-size="12" fill="#142b3b" font-weight="700" text-anchor="middle">L5</text>
<rect x="670" y="555" width="42" height="42" rx="6" fill="#ba2e34" stroke="#9eb7aa" stroke-width="2"/>
<text x="691" y="580" font-size="12" fill="#142b3b" font-weight="700" text-anchor="middle">L6</text>
<path d="M 485,412 L 540,412 L 540,615 L 420,615" fill="none" stroke="#0969aa" stroke-width="2.5"/>
<path d="M 420,615 L 435,615" fill="none" stroke="#334155" stroke-width="3"/>
<rect x="435" y="603" width="54" height="24" rx="3" fill="#fef3c7" stroke="#334155" stroke-width="2"/>
<path d="M 489,615 L 504,615" fill="none" stroke="#334155" stroke-width="3"/>
<text x="462" y="597" font-size="16" fill="#142b3b" font-weight="700" text-anchor="middle">330Ω</text>
<path d="M 504,615 L 525,615 L 525,630" fill="none" stroke="#0969aa" stroke-width="2.5"/>
<path d="M 517,618 L 525,630 L 533,618" fill="none" stroke="#0969aa" stroke-width="3"/>
<text x="400" y="650" font-size="12" fill="#93c5fd" font-weight="700" text-anchor="start">DIN &lt;- Data in</text>
<text x="620" y="650" font-size="11" fill="#fca5a5" font-weight="700" text-anchor="start">DOUT: UNCONNECTED</text>
<path d="M 665,540 L 665,560" fill="none" stroke="#ba2e34" stroke-width="3"/>
<path d="M 647,560 L 683,560" fill="none" stroke="#334155" stroke-width="3"/>
<path d="M 647,570 L 683,570" fill="none" stroke="#334155" stroke-width="6"/>
<path d="M 665,570 L 665,590" fill="none" stroke="#334155" stroke-width="3"/>
<text x="635" y="558" font-size="20" fill="#ba2e34" font-weight="700" text-anchor="start">+</text>
<text x="687" y="578" font-size="22" fill="#334155" font-weight="700" text-anchor="start">-</text>
<text x="691" y="565" font-size="14" fill="#142b3b" font-weight="700" text-anchor="start">1000µF</text>
<rect x="385" y="718" width="355" height="125" rx="10" fill="#ffffff" stroke="#c5d4dd" stroke-width="2"/>
<text x="400" y="742" font-size="14" fill="#142b3b" font-weight="700" text-anchor="start">SSD1306 OLED Display (OPTIONAL)</text>
<text x="400" y="762" font-size="11" fill="#425c6d" font-weight="400" text-anchor="start">Disabled by default in UserConfig.h (PULSESHIFT_OLED_ENABLED = 0)</text>
<text x="400" y="785" font-size="11" fill="#425c6d" font-weight="400" text-anchor="start" class="mono">VCC -&gt; ESP32 3V3     GND -&gt; Common Ground</text>
<text x="400" y="805" font-size="11" fill="#425c6d" font-weight="400" text-anchor="start" class="mono">SDA -&gt; ESP32 GPIO21  SCL -&gt; ESP32 GPIO22</text>
<text x="400" y="825" font-size="10" fill="#425c6d" font-weight="400" text-anchor="start">Provide ESP32-safe 4.7kΩ pull-ups to 3.3V if display lacks onboard pull-ups.</text>
<rect x="20" y="855" width="720" height="145" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="35" y="880" font-size="14" fill="#142b3b" font-weight="700" text-anchor="start">SYSTEM WIRING LEGEND &amp; VERIFICATION CHECKLIST:</text>
<text x="35" y="902" font-size="11" fill="#425c6d" font-weight="400" text-anchor="start">DARK RED = 12V Switched Bike Power   RED = Regulated 5V Rail   ORANGE = 3.3V Logic Supply</text>
<text x="35" y="920" font-size="11" fill="#425c6d" font-weight="400" text-anchor="start">BLACK = Common Ground (All bonded)   BLUE = WS2812B Data (DIN)   PURPLE = CAN Receive (RX2)</text>
<text x="35" y="938" font-size="11" fill="#425c6d" font-weight="400" text-anchor="start">GREEN = Motorcycle CAN-H             YELLOW = Motorcycle CAN-L   DASHED RED = Safety Disconnect</text>
<text x="35" y="962" font-size="12" fill="#142b3b" font-weight="700" text-anchor="start">Before connecting to bike:</text>
<text x="35" y="982" font-size="11" fill="#142b3b" font-weight="400" text-anchor="start">1. Verify 5V regulator output with multimeter before attaching ESP32 or LEDs.</text>
<text x="35" y="995" font-size="11" fill="#142b3b" font-weight="400" text-anchor="start">2. Verify GPIO17 is completely disconnected and transceiver TXD is tied to 3.3V.</text>
</svg>
