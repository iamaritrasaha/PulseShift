<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1560" viewBox="0 0 720 1560" role="img" aria-labelledby="title desc">
<title id="title">Wire the standalone demo</title><desc id="desc">GPIO27 to AHCT125 pin 2; 10k pull-down to ground; pin 3 through 330 ohms to DIN. USB powers ESP32, external 5V powers strip and shifter. All GND labels connect together. Both capacitors connect across the stated supplies.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="720" height="1560" fill="#ffffff"/>
<text x="28" y="44" font-size="30" fill="#142b3b" font-weight="700" text-anchor="start">Wire the standalone demo</text>
<text x="28" y="83" font-size="23" fill="#425c6d" font-weight="400" text-anchor="start">Connection map, not physical board pin positions</text>
<text x="28" y="120" font-size="22" fill="#425c6d" font-weight="400" text-anchor="start">BLUE = data   RED = external 5V   GND = common</text>
<rect x="40" y="172" width="270" height="135" rx="14" fill="#f3f7fa" stroke="#c5d4dd" stroke-width="2"/>
<text x="62" y="207" font-size="25" fill="#142b3b" font-weight="700" text-anchor="start">ESP32 DevKit V1</text>
<text x="62" y="246" font-size="25" fill="#0969aa" font-weight="700" text-anchor="start">GPIO27</text>
<text x="62" y="282" font-size="21" fill="#142b3b" font-weight="400" text-anchor="start">GND → common ground</text>
<text x="45" y="152" font-size="23" fill="#7652ac" font-weight="400" text-anchor="start">USB powers this board</text>
<rect x="440" y="172" width="240" height="200" rx="14" fill="#f3f7fa" stroke="#c5d4dd" stroke-width="2"/>
<text x="458" y="207" font-size="23" fill="#142b3b" font-weight="700" text-anchor="start">SN74AHCT125N</text>
<text x="458" y="250" font-size="24" fill="#0969aa" font-weight="400" text-anchor="start">2 · 1A input</text>
<text x="458" y="299" font-size="24" fill="#0969aa" font-weight="400" text-anchor="start">3 · 1Y output</text>
<text x="458" y="344" font-size="23" fill="#425c6d" font-weight="400" text-anchor="start">Pins below ↓</text>
<path d="M 310,240 L 440,240" fill="none" stroke="#0969aa" stroke-width="4"/>
<path d="M 428,232 L 440,240 L 428,248" fill="none" stroke="#0969aa" stroke-width="4"/>
<circle cx="365" cy="240" r="5" fill="#0969aa"/>
<path d="M 365,240 L 365,275" fill="none" stroke="#0969aa" stroke-width="4"/>
<path d="M 365,275 L 365,287" fill="none" stroke="#334155" stroke-width="4"/>
<rect x="355" y="287" width="20" height="42" rx="2" fill="#f8e8b7" stroke="#334155" stroke-width="2"/>
<path d="M 365,329 L 365,341" fill="none" stroke="#334155" stroke-width="4"/>
<path d="M 365,341 L 365,353" fill="none" stroke="#334155" stroke-width="4"/>
<path d="M 349,353 L 381,353" fill="none" stroke="#334155" stroke-width="4"/>
<path d="M 355,361 L 375,361" fill="none" stroke="#334155" stroke-width="4"/>
<path d="M 361,369 L 369,369" fill="none" stroke="#334155" stroke-width="4"/>
<text x="249" y="321" font-size="24" fill="#142b3b" font-weight="400" text-anchor="start">10kΩ</text>
<text x="259" y="365" font-size="22" fill="#142b3b" font-weight="400" text-anchor="start">GND</text>
<path d="M 560,372 L 560,413 L 88,413 L 88,440" fill="none" stroke="#0969aa" stroke-width="4"/>
<path d="M 88,440 L 88,452" fill="none" stroke="#334155" stroke-width="4"/>
<rect x="78" y="452" width="20" height="42" rx="2" fill="#f8e8b7" stroke="#334155" stroke-width="2"/>
<path d="M 88,494 L 88,506" fill="none" stroke="#334155" stroke-width="4"/>
<path d="M 88,506 L 88,576 L 138,576" fill="none" stroke="#0969aa" stroke-width="4"/>
<path d="M 126,568 L 138,576 L 126,584" fill="none" stroke="#0969aa" stroke-width="4"/>
<text x="124" y="468" font-size="26" fill="#142b3b" font-weight="700" text-anchor="start">330Ω</text>
<text x="124" y="501" font-size="22" fill="#425c6d" font-weight="400" text-anchor="start">Place close to the first LED</text>
<rect x="138" y="539" width="421" height="66" rx="8" fill="#244238" stroke="#244238" stroke-width="2"/>
<rect x="150" y="551" width="42" height="42" rx="6" fill="#41554d" stroke="#9eb7aa" stroke-width="2"/>
<rect x="221" y="551" width="42" height="42" rx="6" fill="#41554d" stroke="#9eb7aa" stroke-width="2"/>
<rect x="292" y="551" width="42" height="42" rx="6" fill="#41554d" stroke="#9eb7aa" stroke-width="2"/>
<rect x="363" y="551" width="42" height="42" rx="6" fill="#41554d" stroke="#9eb7aa" stroke-width="2"/>
<rect x="434" y="551" width="42" height="42" rx="6" fill="#41554d" stroke="#9eb7aa" stroke-width="2"/>
<rect x="505" y="551" width="42" height="42" rx="6" fill="#41554d" stroke="#9eb7aa" stroke-width="2"/>
<text x="139" y="635" font-size="24" fill="#0969aa" font-weight="700" text-anchor="start">DIN</text>
<text x="350" y="635" font-size="24" fill="#142b3b" font-weight="400" text-anchor="start">6 LEDs →</text>
<text x="566" y="635" font-size="24" fill="#142b3b" font-weight="700" text-anchor="start">DOUT</text>
<text x="470" y="671" font-size="22" fill="#425c6d" font-weight="400" text-anchor="start">Leave DOUT unused</text>
<rect x="28" y="710" width="664" height="106" rx="14" fill="#fff3e8" stroke="#e8b885" stroke-width="2"/>
<text x="46" y="744" font-size="26" fill="#ba2e34" font-weight="700" text-anchor="start">External regulated 5V, ≥1A</text>
<text x="46" y="777" font-size="24" fill="#142b3b" font-weight="400" text-anchor="start">+5V → strip +5V and shifter pin 14</text>
<text x="46" y="803" font-size="23" fill="#142b3b" font-weight="400" text-anchor="start">Negative → every GND shown here</text>
<rect x="28" y="839" width="325" height="320" rx="14" fill="#f3f7fa" stroke="#c5d4dd" stroke-width="2"/>
<text x="46" y="876" font-size="22" fill="#142b3b" font-weight="700" text-anchor="start">Shifter pin connections</text>
<text x="46" y="918" font-size="23" fill="#ba2e34" font-weight="400" text-anchor="start">14 · VCC → +5V</text>
<text x="46" y="957" font-size="23" fill="#334155" font-weight="400" text-anchor="start">7 · GND → GND</text>
<text x="46" y="996" font-size="23" fill="#334155" font-weight="400" text-anchor="start">1 · OE → GND</text>
<text x="46" y="1035" font-size="23" fill="#ba2e34" font-weight="400" text-anchor="start">4, 10, 13 → +5V</text>
<text x="46" y="1074" font-size="23" fill="#334155" font-weight="400" text-anchor="start">5, 9, 12 → GND</text>
<text x="46" y="1113" font-size="23" fill="#425c6d" font-weight="400" text-anchor="start">6, 8, 11 → unused</text>
<rect x="375" y="839" width="317" height="150" rx="14" fill="#f3f7fa" stroke="#c5d4dd" stroke-width="2"/>
<text x="390" y="872" font-size="23" fill="#142b3b" font-weight="700" text-anchor="start">100nF at the shifter</text>
<path d="M 565,900 L 565,924" fill="none" stroke="#ba2e34" stroke-width="4"/>
<path d="M 545,924 L 585,924" fill="none" stroke="#334155" stroke-width="4"/>
<path d="M 545,936 L 585,936" fill="none" stroke="#334155" stroke-width="4"/>
<path d="M 565,936 L 565,962" fill="none" stroke="#334155" stroke-width="4"/>
<text x="395" y="914" font-size="22" fill="#ba2e34" font-weight="400" text-anchor="start">14 · +5V</text>
<text x="395" y="964" font-size="22" fill="#334155" font-weight="400" text-anchor="start">7 · GND</text>
<path d="M 500,900 L 565,900" fill="none" stroke="#ba2e34" stroke-width="4"/>
<path d="M 500,962 L 565,962" fill="none" stroke="#334155" stroke-width="4"/>
<rect x="375" y="1009" width="317" height="150" rx="14" fill="#f3f7fa" stroke="#c5d4dd" stroke-width="2"/>
<text x="390" y="1043" font-size="23" fill="#142b3b" font-weight="700" text-anchor="start">1000µF / 10V at LEDs</text>
<path d="M 565,1070 L 565,1094" fill="none" stroke="#ba2e34" stroke-width="4"/>
<path d="M 545,1094 L 585,1094" fill="none" stroke="#334155" stroke-width="4"/>
<path d="M 545,1106 L 585,1106" fill="none" stroke="#334155" stroke-width="7"/>
<path d="M 565,1106 L 565,1132" fill="none" stroke="#334155" stroke-width="4"/>
<text x="523" y="1093" font-size="26" fill="#ba2e34" font-weight="700" text-anchor="start">+</text>
<text x="595" y="1117" font-size="26" fill="#334155" font-weight="700" text-anchor="start">−</text>
<text x="392" y="1084" font-size="21" fill="#ba2e34" font-weight="400" text-anchor="start">Strip +5V</text>
<text x="392" y="1134" font-size="21" fill="#334155" font-weight="400" text-anchor="start">Strip GND</text>
<path d="M 500,1070 L 565,1070" fill="none" stroke="#ba2e34" stroke-width="4"/>
<path d="M 500,1132 L 565,1132" fill="none" stroke="#334155" stroke-width="4"/>
<rect x="28" y="1183" width="664" height="113" rx="14" fill="#f3f7fa" stroke="#c5d4dd" stroke-width="2"/>
<text x="46" y="1218" font-size="23" fill="#142b3b" font-weight="700" text-anchor="start">All GND labels mean the SAME connected wire:</text>
<text x="46" y="1253" font-size="25" fill="#142b3b" font-weight="400" text-anchor="start">ESP32 + strip + shifter + supply negative</text>
<text x="46" y="1280" font-size="22" fill="#425c6d" font-weight="400" text-anchor="start">Also join the pull-down and capacitor grounds.</text>
<rect x="28" y="1320" width="664" height="102" rx="14" fill="#fff1f0" stroke="#e8b1ac" stroke-width="2"/>
<text x="46" y="1355" font-size="27" fill="#ba2e34" font-weight="700" text-anchor="start">DO NOT connect external +5V</text>
<text x="46" y="1391" font-size="23" fill="#ba2e34" font-weight="400" text-anchor="start">to the USB-powered ESP32 5V / VIN / 3V3 pins.</text>
<text x="28" y="1461" font-size="25" fill="#142b3b" font-weight="700" text-anchor="start">CAN module: NOT connected in this demo.</text>
<text x="28" y="1500" font-size="23" fill="#425c6d" font-weight="400" text-anchor="start">Leave GPIO16 and GPIO17 reserved and unconnected.</text>
<text x="28" y="1536" font-size="23" fill="#425c6d" font-weight="400" text-anchor="start">Use the power-order picture before switching on.</text>
</svg>
