<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1185" viewBox="0 0 720 1185" role="img" aria-labelledby="title desc">
<title id="title">PulseShift: Direct GPIO27 LED wiring</title>
<desc id="desc">ESP32 GPIO27 at 3.3V through 330 ohms into LED DIN. USB powers ESP32, external regulated 5V powers the six LEDs.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
path,line,rect,circle{stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
</style>
<rect width="720" height="1185" fill="#ffffff"/>
<text x="28" y="44" font-size="24" fill="#142b3b" font-weight="700" text-anchor="start">PulseShift: Direct GPIO27 LED wiring</text>
<text x="28" y="84" font-size="22" fill="#425c6d" font-weight="400" text-anchor="start">Assemble and check with BOTH supplies disconnected.</text>
<text x="28" y="116" font-size="22" fill="#425c6d" font-weight="400" text-anchor="start">BLUE = 3.3V data   RED = +5V   BLACK = GND</text>
<text x="235" y="151" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="start">USB power</text>
<path d="M 360,154 L 360,175" fill="none" stroke="#7c3aed" stroke-width="4"/>
<path d="M 352,163 L 360,175 L 368,163" fill="none" stroke="#7c3aed" stroke-width="3"/>
<rect x="220" y="175" width="280" height="145" rx="10" fill="#f8fafc" stroke="#c5d4dd" stroke-width="2"/>
<text x="243" y="215" font-size="25" fill="#142b3b" font-weight="700" text-anchor="start">ESP32 DevKit V1</text>
<text x="243" y="255" font-size="24" fill="#0969aa" font-weight="400" text-anchor="start">GPIO27 · 3.3V data</text>
<text x="243" y="292" font-size="24" fill="#334155" font-weight="400" text-anchor="start">GND</text>
<path d="M 220,280 L 40,280 L 40,900 L 680,900" fill="none" stroke="#334155" stroke-width="4"/>
<path d="M 360,320 L 360,345" fill="none" stroke="#0969aa" stroke-width="4"/>
<path d="M 360,345 L 360,357" fill="none" stroke="#334155" stroke-width="3"/>
<rect x="348" y="357" width="24" height="46" rx="3" fill="#fef3c7" stroke="#334155" stroke-width="2"/>
<path d="M 360,403 L 360,415" fill="none" stroke="#334155" stroke-width="3"/>
<text x="378" y="387" font-size="16" fill="#142b3b" font-weight="700" text-anchor="start">330Ω</text>
<path d="M 360,415 L 360,426 L 80,426 L 80,495 L 148,495" fill="none" stroke="#0969aa" stroke-width="4"/>
<path d="M 136,487 L 148,495 L 136,503" fill="none" stroke="#0969aa" stroke-width="3"/>
<text x="64" y="398" font-size="22" fill="#0969aa" font-weight="400" text-anchor="start">Keep the data lead short.</text>
<rect x="148" y="458" width="404" height="69" rx="8" fill="#244238" stroke="#244238" stroke-width="2"/>
<rect x="160" y="470" width="45" height="45" rx="6" fill="#41554d" stroke="#9eb7aa" stroke-width="2"/>
<rect x="227" y="470" width="45" height="45" rx="6" fill="#41554d" stroke="#9eb7aa" stroke-width="2"/>
<rect x="294" y="470" width="45" height="45" rx="6" fill="#41554d" stroke="#9eb7aa" stroke-width="2"/>
<rect x="361" y="470" width="45" height="45" rx="6" fill="#41554d" stroke="#9eb7aa" stroke-width="2"/>
<rect x="428" y="470" width="45" height="45" rx="6" fill="#41554d" stroke="#9eb7aa" stroke-width="2"/>
<rect x="495" y="470" width="45" height="45" rx="6" fill="#41554d" stroke="#9eb7aa" stroke-width="2"/>
<text x="144" y="455" font-size="25" fill="#0969aa" font-weight="700" text-anchor="start">DIN</text>
<path d="M 552,495 L 630,495" fill="none" stroke="#0969aa" stroke-width="4"/>
<circle cx="630" cy="495" r="4" fill="#0969aa"/>
<text x="495" y="455" font-size="24" fill="#425c6d" font-weight="400" text-anchor="start">DOUT unused</text>
<text x="241" y="563" font-size="24" fill="#142b3b" font-weight="700" text-anchor="start">Six LEDs -&gt;</text>
<path d="M 200,527 L 200,620 L 40,620" fill="none" stroke="#334155" stroke-width="4"/>
<circle cx="40" cy="620" r="5" fill="#334155"/>
<text x="118" y="575" font-size="24" fill="#334155" font-weight="400" text-anchor="start">GND</text>
<path d="M 480,527 L 480,600 L 650,600 L 650,760" fill="none" stroke="#ba2e34" stroke-width="4"/>
<text x="492" y="575" font-size="24" fill="#ba2e34" font-weight="700" text-anchor="start">+5V</text>
<path d="M 650,660 L 360,660 L 360,710" fill="none" stroke="#ba2e34" stroke-width="4"/>
<circle cx="650" cy="660" r="5" fill="#ba2e34"/>
<path d="M 360,710 L 360,730" fill="none" stroke="#ba2e34" stroke-width="3"/>
<path d="M 342,730 L 378,730" fill="none" stroke="#334155" stroke-width="3"/>
<path d="M 342,740 L 378,740" fill="none" stroke="#334155" stroke-width="6"/>
<path d="M 360,740 L 360,760" fill="none" stroke="#334155" stroke-width="3"/>
<text x="330" y="728" font-size="20" fill="#ba2e34" font-weight="700" text-anchor="start">+</text>
<text x="382" y="748" font-size="22" fill="#334155" font-weight="700" text-anchor="start">-</text>
<text x="386" y="735" font-size="14" fill="#142b3b" font-weight="700" text-anchor="start">1000µF/10V</text>
<path d="M 360,760 L 360,900" fill="none" stroke="#334155" stroke-width="4"/>
<circle cx="360" cy="900" r="5" fill="#334155"/>
<text x="69" y="716" font-size="25" fill="#142b3b" font-weight="700" text-anchor="start">1000µF / 10V</text>
<text x="69" y="755" font-size="23" fill="#ba2e34" font-weight="400" text-anchor="start">+ lead to LED +5V</text>
<text x="69" y="793" font-size="23" fill="#142b3b" font-weight="400" text-anchor="start">- striped side to GND</text>
<rect x="440" y="760" width="240" height="100" rx="10" fill="#fff2f0" stroke="#c5d4dd" stroke-width="2"/>
<text x="459" y="792" font-size="25" fill="#ba2e34" font-weight="700" text-anchor="start">Regulated 5V</text>
<text x="459" y="824" font-size="24" fill="#142b3b" font-weight="400" text-anchor="start">At least 1A</text>
<text x="628" y="751" font-size="27" fill="#ba2e34" font-weight="700" text-anchor="start">+</text>
<path d="M 500,860 L 500,900" fill="none" stroke="#334155" stroke-width="4"/>
<circle cx="500" cy="900" r="5" fill="#334155"/>
<text x="517" y="888" font-size="22" fill="#142b3b" font-weight="400" text-anchor="start">Supply GND</text>
<text x="28" y="935" font-size="23" fill="#142b3b" font-weight="700" text-anchor="start">Common GND: ESP32 + LEDs + supply negative</text>
<rect x="28" y="963" width="664" height="92" rx="10" fill="#fff1f0" stroke="#e8b1ac" stroke-width="2"/>
<text x="44" y="997" font-size="27" fill="#ba2e34" font-weight="700" text-anchor="start">DO NOT connect external +5V</text>
<text x="44" y="1031" font-size="24" fill="#ba2e34" font-weight="400" text-anchor="start">to USB-powered ESP32 5V / VIN / 3V3 pins.</text>
<text x="28" y="1094" font-size="24" fill="#142b3b" font-weight="700" text-anchor="start">CAN module disconnected; GPIO16/17 reserved.</text>
<text x="28" y="1133" font-size="25" fill="#ba2e34" font-weight="700" text-anchor="start">Direct 3.3V data is strip-dependent.</text>
<text x="28" y="1170" font-size="23" fill="#425c6d" font-weight="400" text-anchor="start">A compatible strip must be confirmed by physical testing.</text>
</svg>
