[platformio]
default_envs = esp32dev_wokwi

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra
lib_deps =
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.17.0
    adafruit/Adafruit NeoPixel@1.12.3

[env:esp32dev_wokwi]
; Choose TWAI test or frame replay in include/config.h.

[env:esp32dev_bike]
; Receive-only. Set bitrate only after verification; 0 keeps TWAI stopped.
build_flags = ${env.build_flags} -DREVIX_MODE=3 -DREVIX_BITRATE=0
build_src_filter = +<*> -<simulated_ecu.cpp>
