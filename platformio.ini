[platformio]
default_envs = esp32dev_wokwi

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra
lib_deps =
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.17.0
    adafruit/Adafruit NeoPixel@1.12.3

[env:esp32dev_wokwi]
; Synthetic frame replay with the existing OLED dashboard enabled for Wokwi.
; UserConfig.h keeps OLED disabled by default in the Arduino IDE package.
build_flags = ${env.build_flags} -DREVIX_OLED_ENABLED=1

[env:esp32dev_twai_test]
; Experimental Wokwi self-test. The 500 kbit/s setting is simulator-only.
; This target transmits test frames and is not a verified motorcycle bitrate.
build_flags = ${env.build_flags} -DREVIX_MODE=2 -DREVIX_BITRATE=500000

[env:esp32dev_bike]
; Receive-only. Set bitrate only after verification; 0 keeps TWAI stopped.
build_flags = ${env.build_flags} -DREVIX_MODE=3 -DREVIX_BITRATE=0
build_src_filter = +<*> -<simulated_ecu.cpp>
