name: Pre-check (disposable)

# Disposable fast pre-check for the LED engine test before the full CI gate
# runs. This workflow is temporary and will be removed before the release PR
# merges; it never gates the PR.
on:
  workflow_dispatch:
  push:
    branches:
      - "release/**"
    paths:
      - "PulseShift/src/led_effects.*"
      - "test/test_led_effects.cpp"

permissions:
  contents: read

jobs:
  led-test:
    name: LED test pre-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run LED test first, then the remaining host suite
        run: |
          set -euo pipefail
          BUILD_DIR="${RUNNER_TEMP}/pulseshift-precheck"
          mkdir -p "$BUILD_DIR"
          CXXFLAGS="-std=c++17 -Wall -Wextra -Werror -pedantic -g -fsanitize=address,undefined -fno-omit-frame-pointer"

          echo "=== 1. LED engine test (pre-check) ==="
          g++ $CXXFLAGS \
              -DPULSESHIFT_SERIAL_DIAGNOSTICS=0 \
              -IPulseShift -IPulseShift/src \
              PulseShift/src/rpm_candidate.cpp PulseShift/src/config_manager.cpp \
              PulseShift/src/led_effects.cpp \
              test/test_led_effects.cpp -o "$BUILD_DIR/test_led_effects"
          "$BUILD_DIR/test_led_effects"

          echo "=== 2. Remaining host tests ==="
          bash test/run.sh

      - name: Report
        if: always()
        run: echo "Pre-check finished."
