name: Firmware CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ESP32_INDEX_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  ESP32_FQBN: esp32:esp32:esp32

jobs:
  build:
    name: Compile Arduino sketch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.1.1

      - name: Cache Arduino packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
          key: ${{ runner.os }}-arduino-cli-1.1.1-esp32-2.0.17-neopixel-1.12.3-oled-2.5.13-gfx-1.11.11-busio-1.17.0

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls "$ESP32_INDEX_URL"
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib update-index
          arduino-cli lib install --no-deps "Adafruit NeoPixel@1.12.3"
          arduino-cli lib install --no-deps "Adafruit SSD1306@2.5.13"
          arduino-cli lib install --no-deps "Adafruit GFX Library@1.11.11"
          arduino-cli lib install --no-deps "Adafruit BusIO@1.17.0"

      - name: Compile - Demo mode (default)
        run: |
          arduino-cli compile \
            --fqbn "$ESP32_FQBN" \
            --build-path "$RUNNER_TEMP/build-demo" \
            PulseShift

      - name: Compile - CAN Capture mode
        run: |
          arduino-cli compile \
            --fqbn "$ESP32_FQBN" \
            --build-property "build.extra_flags=-DPULSESHIFT_OPERATING_MODE=3 -DPULSESHIFT_CAN_BITRATE=0" \
            --build-path "$RUNNER_TEMP/build-capture" \
            PulseShift

      - name: Compile - OLED enabled
        run: |
          arduino-cli compile \
            --fqbn "$ESP32_FQBN" \
            --build-property "build.extra_flags=-DPULSESHIFT_OLED_ENABLED=1" \
            --build-path "$RUNNER_TEMP/build-oled" \
            PulseShift

      - name: Reject invalid user configuration
        run: |
          cp -r PulseShift "$RUNNER_TEMP/invalid-config"
          sed -i 's/#define PULSESHIFT_LED_COUNT 6/#define PULSESHIFT_LED_COUNT 0/' \
            "$RUNNER_TEMP/invalid-config/UserConfig.h"
          log="$RUNNER_TEMP/invalid-config.log"
          if arduino-cli compile \
            --fqbn "$ESP32_FQBN" \
            --build-path "$RUNNER_TEMP/build-invalid" \
            "$RUNNER_TEMP/invalid-config" > "$log" 2>&1; then
            echo "Invalid config unexpectedly compiled" >&2
            exit 1
          fi
          grep -F "PULSESHIFT_LED_COUNT must be between 1 and 32" "$log"

  host-tests:
    name: Host C++ unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run host-side C++ tests and Python tests
        run: bash test/run.sh
