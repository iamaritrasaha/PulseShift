name: Firmware CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ESP32_INDEX_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  ESP32_FQBN: esp32:esp32:esp32

jobs:
  build:
    name: Compile Arduino sketch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.1.1

      - name: Cache Arduino packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
          key: ${{ runner.os }}-arduino-cli-1.1.1-esp32-2.0.17-neopixel-1.12.3-oled-2.5.13-gfx-1.11.11-busio-1.17.0

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls "$ESP32_INDEX_URL"
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib update-index
          arduino-cli lib install --no-deps "Adafruit NeoPixel@1.12.3"
          arduino-cli lib install --no-deps "Adafruit SSD1306@2.5.13"
          arduino-cli lib install --no-deps "Adafruit GFX Library@1.11.11"
          arduino-cli lib install --no-deps "Adafruit BusIO@1.17.0"

      - name: Compile - CAN Capture mode (default)
        run: |
          arduino-cli compile \
            --fqbn "$ESP32_FQBN" \
            --build-path "$RUNNER_TEMP/build-capture" \
            PulseShift

      - name: Compile - Vehicle RPM mode
        run: |
          mkdir -p "$RUNNER_TEMP/variants/vehicle"
          cp -r PulseShift "$RUNNER_TEMP/variants/vehicle/PulseShift"
          sed -i 's/#define PULSESHIFT_OPERATING_MODE PULSESHIFT_USER_MODE_CAN_CAPTURE/#define PULSESHIFT_OPERATING_MODE PULSESHIFT_USER_MODE_VEHICLE_RPM/' \
            "$RUNNER_TEMP/variants/vehicle/PulseShift/UserConfig.h"
          arduino-cli compile \
            --fqbn "$ESP32_FQBN" \
            --build-path "$RUNNER_TEMP/build-vehicle" \
            "$RUNNER_TEMP/variants/vehicle/PulseShift"

      - name: Compile - OLED enabled
        run: |
          mkdir -p "$RUNNER_TEMP/variants/oled"
          cp -r PulseShift "$RUNNER_TEMP/variants/oled/PulseShift"
          sed -i 's/#define PULSESHIFT_OLED_ENABLED 0/#define PULSESHIFT_OLED_ENABLED 1/' \
            "$RUNNER_TEMP/variants/oled/PulseShift/UserConfig.h"
          arduino-cli compile \
            --fqbn "$ESP32_FQBN" \
            --build-path "$RUNNER_TEMP/build-oled" \
            "$RUNNER_TEMP/variants/oled/PulseShift"

      - name: Reject DEMO mode in production builds
        run: |
          mkdir -p "$RUNNER_TEMP/variants/demo"
          cp -r PulseShift "$RUNNER_TEMP/variants/demo/PulseShift"
          sed -i 's/#define PULSESHIFT_OPERATING_MODE PULSESHIFT_USER_MODE_CAN_CAPTURE/#define PULSESHIFT_OPERATING_MODE PULSESHIFT_USER_MODE_DEMO/' \
            "$RUNNER_TEMP/variants/demo/PulseShift/UserConfig.h"
          log="$RUNNER_TEMP/demo-rejected.log"
          if arduino-cli compile \
            --fqbn "$ESP32_FQBN" \
            --build-path "$RUNNER_TEMP/build-demo" \
            "$RUNNER_TEMP/variants/demo/PulseShift" > "$log" 2>&1; then
            echo "DEMO mode unexpectedly compiled in production build" >&2
            exit 1
          fi
          grep -F "DEMO mode is excluded from production firmware" "$log"

      - name: Reject invalid user configuration
        run: |
          mkdir -p "$RUNNER_TEMP/variants/invalid"
          cp -r PulseShift "$RUNNER_TEMP/variants/invalid/PulseShift"
          sed -i 's/#define PULSESHIFT_LED_COUNT 6/#define PULSESHIFT_LED_COUNT 0/' \
            "$RUNNER_TEMP/variants/invalid/PulseShift/UserConfig.h"
          log="$RUNNER_TEMP/invalid-config.log"
          if arduino-cli compile \
            --fqbn "$ESP32_FQBN" \
            --build-path "$RUNNER_TEMP/build-invalid" \
            "$RUNNER_TEMP/variants/invalid/PulseShift" > "$log" 2>&1; then
            echo "Invalid config unexpectedly compiled" >&2
            exit 1
          fi
          grep -F "PULSESHIFT_LED_COUNT must be between 1 and 32" "$log"

  host-tests:
    name: Host C++ unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run host-side C++ tests and Python tests
        run: bash test/run.sh
