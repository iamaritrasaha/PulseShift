name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  notes:
    name: Validate version-specific prerelease notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Enforce v0.x prerelease notes and qualification limits
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare_release_notes.py --tag "$RELEASE_TAG" --notes RELEASE_NOTES.md

  verify:
    name: Verify tagged source and Arduino package
    needs: notes
    uses: ./.github/workflows/ci.yml
    with:
      package_version: ${{ github.ref_name }}
    permissions:
      contents: read

  publish:
    name: Publish verified Arduino software prerelease
    needs: [notes, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the same tagged notes and publication scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download verified Arduino assets
        uses: actions/download-artifact@v4
        with:
          name: pulseshift-arduino-release-assets
          path: release-assets
      - name: Publish with version-specific notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/publish_prerelease.sh "$RELEASE_TAG" release-assets RELEASE_NOTES.md
