name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ESP32_INDEX_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
      ESP32_FQBN: esp32:esp32:esp32doit-devkit-v1
      NVS_GUARD: compiler.c.elf.extra_flags=-Wl,--wrap=nvs_flash_init

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.1.1

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls "$ESP32_INDEX_URL"
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli lib update-index
          arduino-cli lib install --no-deps "NimBLE-Arduino@2.3.8"

      - name: Compile and verify sketch
        run: |
          arduino-cli compile \
            --fqbn "$ESP32_FQBN" --build-property "$NVS_GUARD" \
            --build-path "$RUNNER_TEMP/build-release" \
            PulseShift
          test "$(( $(wc -c < "$RUNNER_TEMP/build-release/PulseShift.ino.bin") + 76 ))" -le 1310720

      - name: Package Arduino sketch ZIP
        run: |
          ZIP="PulseShift-Arduino-$GITHUB_REF_NAME.zip"
          git archive --format=zip --output="$RUNNER_TEMP/$ZIP" HEAD PulseShift/ docs/TESTING.md
          (cd "$RUNNER_TEMP" && sha256sum "$ZIP" > "$ZIP.sha256")
          echo "ZIP=$RUNNER_TEMP/$ZIP" >> "$GITHUB_ENV"
          echo "SHA=$RUNNER_TEMP/$ZIP.sha256" >> "$GITHUB_ENV"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP }}
            ${{ env.SHA }}
          draft: true
          generate_release_notes: true
